<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>鞋款 BOM 管理系统</title>
    <link rel="stylesheet" href="/static/build/boom-system-frontend.css">
    <style>
        :root { font-family: Arial, "Microsoft YaHei", sans-serif; color: #1f2937; background: #f3f5f8; font-size: 13px; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 16px; }
        button, input, select { font: inherit; }
        button { cursor: pointer; }
        .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: start; }
        .panel, .sidebar { background: #fff; border: 1px solid #e2e8f0; border-radius: 7px; box-shadow: 0 2px 8px #0f172a0d; }
        .sidebar { position: sticky; top: 16px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; overflow: hidden; }
        .sidebar h1 { margin: 0; padding: 16px; border-bottom: 1px solid #e2e8f0; font-size: 16px; }
        .search { display: flex; gap: 6px; padding: 10px; }
        .search input { min-width: 0; flex: 1; }
        input, select { padding: 7px 8px; border: 1px solid #cbd5e1; border-radius: 4px; background: white; }
        #style-list { min-height: 120px; overflow: auto; padding: 4px 8px 10px; }
        .style-option { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; margin: 2px 0; padding: 9px; border: 0; border-radius: 4px; background: transparent; text-align: left; }
        .style-option-brand { margin-left: auto; text-align: right; overflow-wrap: anywhere; }
        .style-option:hover { background: #f1f5f9; }
        .style-option.active { background: #dbeafe; color: #1d4ed8; font-weight: 700; }
        .sidebar-note { padding: 8px 12px; color: #64748b; font-size: 12px; }
        .style-actions { display: flex; gap: 8px; margin: 8px; }
        .style-actions .button { flex: 1; padding: 7px 8px; }
        .content { min-width: 0; }
        .panel { padding: 16px; margin-bottom: 14px; }
        .header-grid { display: grid; grid-template-columns: repeat(4, minmax(130px, 1fr)); gap: 10px; }
        .header-field { display: flex; flex-direction: column; gap: 4px; color: #475569; font-size: 12px; }
        .header-field input { color: #111827; }
        .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .button { padding: 7px 12px; border: 0; border-radius: 4px; background: #2563eb; color: white; font-weight: 600; }
        .button:hover { background: #1d4ed8; }
        .button.secondary { background: #475569; }
        .button.danger { background: #dc2626; }
        .button:disabled { opacity: .55; cursor: not-allowed; }
        .editable-column-title { border-bottom: 1px dashed #94a3b8; cursor: text; }
        .column-title-editor { width: 100%; min-width: 60px; padding: 2px 4px; }
        .row-context-menu { position: fixed; z-index: 30; min-width: 160px; padding: 4px; border: 1px solid #cbd5e1; border-radius: 6px; background: white; box-shadow: 0 8px 24px #0f172a26; }
        .row-context-menu button { display: block; width: 100%; padding: 8px 12px; border: 0; border-radius: 3px; background: white; color: #1f2937; text-align: left; }
        .row-context-menu button:hover:not(:disabled) { background: #eff6ff; }
        .row-context-menu button:disabled { color: #94a3b8; cursor: not-allowed; }
        .row-context-menu .menu-danger { color: #b91c1c; }
        .menu-separator { height: 1px; margin: 4px 2px; background: #e2e8f0; }
        .column-context-menu { position: fixed; z-index: 31; min-width: 140px; padding: 4px; border: 1px solid #cbd5e1; border-radius: 6px; background: white; box-shadow: 0 8px 24px #0f172a26; }
        .column-context-menu button { display: block; width: 100%; padding: 8px 12px; border: 0; border-radius: 3px; background: white; color: #1f2937; text-align: left; }
        .column-context-menu button:hover:not(:disabled) { background: #eff6ff; }
        .column-context-menu button:disabled { color: #94a3b8; cursor: not-allowed; }
        .column-context-menu .menu-danger { color: #b91c1c; }
        #status { min-height: 19px; margin-left: auto; color: #047857; }
        #status.error { color: #b91c1c; }
        #bom-table { width: 100%; height: 620px; }
        #bom-table .table-shell { height: 100%; }
        .modal-backdrop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: #0f172a80; }
        .modal { width: min(700px, 100%); max-height: 90vh; overflow: auto; background: white; border-radius: 8px; padding: 20px; }
        .modal h2 { margin: 0 0 16px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
        [hidden] { display: none !important; }
        @media (max-width: 1000px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar { position: static; max-height: 280px; }
            .header-grid { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
        }
        @media (max-width: 560px) {
            body { padding: 8px; }
            .header-grid { grid-template-columns: 1fr; }
            #status { width: 100%; margin-left: 0; }
        }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar" aria-label="Style No. 鞋款列表">
        <h1>Style No. 列表</h1>
        <form class="search" id="search-form">
            <input id="search-prefix" type="search" placeholder="搜索编号前缀" aria-label="搜索 Style No.">
            <button class="button" type="submit">搜索</button>
        </form>
        <nav id="style-list" aria-label="鞋款列表"></nav>
        <div id="list-status" class="sidebar-note" aria-live="polite"></div>
        <div class="style-actions">
            <button class="button" id="create-style" type="button">新增鞋款</button>
            <button class="button danger" id="delete-style" type="button">删除鞋款</button>
        </div>
    </aside>
    <main class="content">
        <section class="panel">
            <div id="header-fields" class="header-grid"></div>
        </section>
        <section class="panel">
            <div class="toolbar">
                <button class="button" id="confirm-save" type="button" disabled>确认保存</button>
                <button class="button secondary" id="import-table" type="button">导入 Excel/CSV</button>
                <button class="button secondary" id="export-table" type="button">导出 Excel/CSV</button>
                <label>编辑模式
                    <select id="edit-mode">
                        <option value="cell">单元格编辑</option>
                        <option value="row">整行编辑</option>
                    </select>
                </label>
                <span id="status" aria-live="polite">正在加载前端组件…</span>
            </div>
            <div id="bom-table"></div>
        </section>
    </main>
</div>

<div id="create-backdrop" class="modal-backdrop" hidden>
    <form id="create-form" class="modal">
        <h2>新增鞋款</h2>
        <div id="create-fields" class="header-grid"></div>
        <div class="modal-actions">
            <button class="button secondary" id="cancel-create" type="button">取消</button>
            <button class="button" type="submit">创建</button>
        </div>
    </form>
</div>

<div id="export-backdrop" class="modal-backdrop" hidden>
    <form id="export-form" class="modal">
        <h2>导出文件</h2>
        <label class="header-field" for="export-format">文件格式
            <select id="export-format">
                <option value="xlsx">Excel（.xlsx）</option>
                <option value="csv">CSV（.csv）</option>
            </select>
        </label>
        <div class="modal-actions">
            <button class="button secondary" id="cancel-export" type="button">取消</button>
            <button class="button" type="submit">导出</button>
        </div>
    </form>
</div>

<div id="component-backdrop" class="modal-backdrop" hidden>
    <form id="component-form" class="modal">
        <h2>添加组件</h2>
        <label class="header-field" for="component-select">选择现有分类
            <select id="component-select" required></select>
        </label>
        <div class="modal-actions">
            <button class="button secondary" id="cancel-component" type="button">取消</button>
            <button class="button" type="submit">添加组件</button>
        </div>
    </form>
</div>

<div id="row-context-menu" class="row-context-menu" role="menu" hidden>
    <button type="button" role="menuitem" data-action="add-row">添加行</button>
    <button type="button" role="menuitem" data-action="add-node">添加节点行</button>
    <div class="menu-separator" role="separator"></div>
    <button type="button" role="menuitem" data-action="add-component">添加组件</button>
    <button type="button" role="menuitem" data-action="delete-component" class="menu-danger">删除组件</button>
    <div class="menu-separator" role="separator"></div>
    <button type="button" role="menuitem" data-action="copy">复制</button>
    <button type="button" role="menuitem" data-action="paste">粘贴</button>
    <button type="button" role="menuitem" data-action="delete" class="menu-danger">删除</button>
</div>
<div id="column-context-menu" class="column-context-menu" role="menu" hidden>
    <button type="button" role="menuitem" data-action="add">添加列</button>
    <button type="button" role="menuitem" data-action="copy">复制</button>
    <button type="button" role="menuitem" data-action="paste">粘贴</button>
    <button type="button" role="menuitem" data-action="delete" class="menu-danger">删除</button>
</div>

<script src="/static/build/bom-vendor.js" onerror="document.getElementById('status').textContent='前端组件加载失败，请检查 /static/build/bom-vendor.js'; document.getElementById('status').classList.add('error')"></script>
<script>
(() => {
    'use strict';

    const vendor = window.BOMVendor;
    if (!vendor) {
        document.getElementById('status').textContent = 'Vxe-Table 资源未加载，请重新构建前端';
        document.getElementById('status').classList.add('error');
        return;
    }

    const { createApp, h, reactive, VxeUI, VxeTable, ExcelJS } = vendor;
    const VxeTableComponent = VxeTable.VxeTable;
    const VxeColumnComponent = VxeTable.VxeColumn;
    const VxeToolbarComponent = VxeTable.VxeToolbar;
    const categoryNames = [
        ['upper', '鞋面'],
        ['lining', '内里'],
        ['reinforcement', '补强'],
        ['sock_liner', '袜套'],
        ['insole', '鞋垫'],
        ['outsole', '大底'],
        ['accessories', '配件'],
        ['packing', '包装'],
        ['stitching', '车缝'],
        ['rem', 'REM']
    ];
    const headerDefinitions = [
        ['style_no', 'Style No.'],
        ['company_title', 'Company Title'],
        ['order_title', 'Order Title'],
        ['style_name', 'Style Name'],
        ['sample_order_no', 'Sample Order No.'],
        ['sample_type', 'Sample Type'],
        ['customer', 'Customer'],
        ['season', 'Season'],
        ['brand', 'Brand'],
        ['gender', 'Gender'],
        ['last_no', 'Last No.'],
        ['shoe_type', 'Shoe Type'],
        ['bottom_no', 'Bottom No.'],
        ['shoe_filler_no', 'Shoe Filler No.'],
        ['pattern_master', 'Pattern Master'],
        ['tooling_master', 'Tooling Master'],
        ['create_date', 'Create Date'],
        ['print_date', 'Print Date'],
        ['request_finish_date', 'Request Finish Date']
    ];
    const colorColumnCount = 8;
    const activeComponents = reactive(categoryNames.map(([category]) => category));
    const gridState = reactive({ rows: [], editMode: 'cell' });
    const gridColumns = [
        { field: 'category_label', title: '分类', width: 90 },
        { field: 'no', title: 'No.', width: 65 },
        { field: 'parts', title: 'Parts', width: 180 },
        { field: 'material_description', title: 'Material Description', width: 300 },
        { field: 'unit', title: 'Unit', width: 100 },
        { field: 'supplier', title: 'Supplier', width: 160 },
        { field: 'remark', title: 'Remark', width: 160 }
    ];
    for (let index = 0; index < colorColumnCount; index++) {
        gridColumns.push(
            { field: `color_${index}`, title: `配色 ${index + 1}`, width: 150, colorIndex: index },
            { field: `process_${index}`, title: `工艺 ${index + 1}`, width: 180, processIndex: index }
        );
    }

    let activeStyleNo = new URL(location.href).searchParams.get('bom_id') || '';
    let gridTable = null;
    let gridToolbar = null;
    let connectedTable = null;
    let connectedToolbar = null;
    let writeQueue = Promise.resolve();
    let savedHeader = {};
    let savedColorCodeValues = [];
    let hasUnsavedChanges = false;
    let isSavingDraft = false;
    let nextDraftItemID = -1;
    let draftColumnTitles = {};

    const status = document.getElementById('status');
    const listStatus = document.getElementById('list-status');
    const styleList = document.getElementById('style-list');
    const confirmSaveButton = document.getElementById('confirm-save');
    const bomQuery = () => `bom_id=${encodeURIComponent(activeStyleNo)}`;
    const styleURL = styleNo => {
        const url = new URL(location.href);
        url.searchParams.set('bom_id', styleNo);
        return url;
    };
    const showStatus = (message, isError = false) => {
        status.textContent = message;
        status.classList.toggle('error', isError);
        if (!isError) window.setTimeout(() => {
            if (status.textContent === message) status.textContent = '';
        }, 3500);
    };
    const updateSaveButton = () => {
        confirmSaveButton.disabled = !activeStyleNo || isSavingDraft;
        confirmSaveButton.textContent = isSavingDraft
            ? '正在保存…'
            : hasUnsavedChanges ? '确认保存 *' : '确认保存';
    };
    const markUnsavedChanges = message => {
        hasUnsavedChanges = true;
        updateSaveButton();
        showStatus(message || '页面有未保存的修改，请点击“确认保存”写入数据库');
    };
    const discardUnsavedChanges = () => {
        hasUnsavedChanges = false;
        updateSaveButton();
    };
    window.addEventListener('error', event => {
        showStatus(`页面脚本错误：${event.message || '请查看浏览器控制台'}`, true);
    });
    window.addEventListener('unhandledrejection', event => {
        const reason = event.reason;
        showStatus(`页面初始化失败：${reason?.message || String(reason)}`, true);
    });
    const fetchJSON = async (url, options = {}) => {
        const response = await fetch(url, options);
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `请求失败 (${response.status})`);
        return result;
    };
    const postJSON = (url, body) => {
        const separator = url.includes('?') ? '&' : '?';
        return fetchJSON(`${url}${separator}${bomQuery()}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
    };
    const queueWrite = operation => {
        const next = writeQueue.then(operation);
        writeQueue = next.catch(() => {});
        return next;
    };
    const makeField = ([field, label], value = '', container = document.getElementById('header-fields')) => {
        const wrapper = document.createElement('label');
        wrapper.className = 'header-field';
        wrapper.textContent = label;
        const input = document.createElement('input');
        input.name = field;
        input.dataset.field = field;
        input.value = value ?? '';
        if (['create_date', 'print_date', 'request_finish_date'].includes(field)) input.type = 'date';
        if (field === 'style_no') input.maxLength = 63;
        wrapper.appendChild(input);
        container.appendChild(wrapper);
        return input;
    };

    headerDefinitions.forEach(field => makeField(field));
    const createFieldNames = headerDefinitions.filter(([field]) => field !== 'style_no');
    const createFields = document.getElementById('create-fields');
    const createStyleNoInput = makeField(['style_no', 'Style No.'], '', createFields);
    createFieldNames.forEach(field => makeField(field, '', createFields));

    const fieldInput = field => document.querySelector(`#header-fields [data-field="${field}"]`);

    const fixedColumnFields = new Set([
        'category_label', 'no', 'parts', 'material_description', 'unit', 'supplier', 'remark'
    ]);
    const columnTitleStorageKey = 'boom-bom-column-titles-v1';
    let savedColumnTitles = {};
    try {
        const storedTitles = JSON.parse(localStorage.getItem(columnTitleStorageKey) || '{}');
        if (storedTitles && typeof storedTitles === 'object' && !Array.isArray(storedTitles)) {
            savedColumnTitles = storedTitles;
        }
    } catch (error) {
        showStatus(`读取自定义列名失败：${error.message}`, true);
    }
    draftColumnTitles = { ...savedColumnTitles };
    const columns = reactive(gridColumns.map(column => ({
        ...column,
        title: typeof draftColumnTitles[column.field] === 'string' && draftColumnTitles[column.field].trim()
            ? draftColumnTitles[column.field].trim()
            : column.title,
        editable: column.field !== 'category_label',
        editableTitle: !fixedColumnFields.has(column.field)
    })));
    const customColumns = reactive([]);
    const hiddenBuiltInColumns = reactive([]);
    function syncCustomColumns(metadata, hiddenColumns = hiddenBuiltInColumns) {
        hiddenBuiltInColumns.splice(0, hiddenBuiltInColumns.length, ...hiddenColumns);
        columns.splice(0, columns.length, ...gridColumns.filter(column =>
            !hiddenBuiltInColumns.includes(column.field)
        ).map(column => ({
            ...column,
            title: typeof draftColumnTitles[column.field] === 'string' && draftColumnTitles[column.field].trim()
                ? draftColumnTitles[column.field].trim()
                : column.title,
            editable: column.field !== 'category_label',
            editableTitle: !fixedColumnFields.has(column.field)
        })));
        customColumns.splice(0, customColumns.length, ...metadata);
        [...metadata].sort((left, right) => left.position - right.position).forEach(column => {
            const field = `custom_${column.id}`;
            columns.splice(Math.max(7, Math.min(column.position, columns.length)), 0, {
                field,
                title: column.title,
                width: 180,
                editable: true,
                editableTitle: true,
                customId: column.id
            });
        });
    }
    const columnTitleEdit = reactive({ field: '', value: '' });
    const beginColumnTitleEdit = column => {
        columnTitleEdit.field = column.field;
        columnTitleEdit.value = column.title;
    };
    const finishColumnTitleEdit = async column => {
        if (columnTitleEdit.field !== column.field) return;
        const title = columnTitleEdit.value.trim();
        columnTitleEdit.field = '';
        if (!title) {
            showStatus('列名不能为空', true);
            return;
        }
        if (column.customId) {
            const metadata = customColumns.map(item => item.id === column.customId
                ? { ...item, title }
                : { ...item });
            syncCustomColumns(metadata);
            markUnsavedChanges('自定义列名已修改，点击“确认保存”后写入数据库');
            return;
        }
        column.title = title;
        draftColumnTitles[column.field] = title;
        markUnsavedChanges('列名已修改，点击“确认保存”后应用');
    };
    const editableFields = () => columns.filter(column => column.editable).map(column => column.field);
    const colorCodesText = values => {
        if (!Array.isArray(values)) return '';
        const codes = [...values];
        while (codes.length && !codes[codes.length - 1]) codes.pop();
        return codes.join(', ');
    };
    const upperColorCodes = items => {
        const upperRows = (items || []).filter(item =>
            item.category === 'upper' && Array.isArray(item.color_codes)
        );
        const source = upperRows.find(item => item.color_codes.some(code => String(code || '').trim())) ||
            upperRows[0];
        return [...(source?.color_codes || [])];
    };
    const colorCodesValue = value => {
        const text = String(value ?? '').trim();
        if (!text) return [];
        const values = text.split(',').map(code => code.trim());
        while (values.length && values[values.length - 1] === '') values.pop();
        if (values.length > colorColumnCount) {
            throw new Error(`Color Codes 最多支持 ${colorColumnCount} 个值`);
        }
        return values;
    };
    let savedRowValues = new Map();
    const connectToolbar = () => {
        if (gridTable && gridToolbar &&
            (gridTable !== connectedTable || gridToolbar !== connectedToolbar)) {
            connectedTable = gridTable;
            connectedToolbar = gridToolbar;
            gridTable.connectToolbar(gridToolbar);
        }
    };
    const setGridTable = instance => {
        gridTable = instance;
        if (!instance) connectedTable = null;
        connectToolbar();
    };
    const setGridToolbar = instance => {
        gridToolbar = instance;
        if (!instance) connectedToolbar = null;
        connectToolbar();
    };
    const categoryFilters = categoryNames.map(([value, label]) => ({ label, value }));
    const saveFile = (filename, type, content) => gridTable.saveFile({ filename, type, content });
    const flatMaterialRows = rows => {
        const result = [];
        const visit = items => items.forEach(row => {
            if (row.row_key && !row.isCategory && !row.isColorCodesSummary) result.push(row);
            if (row.children?.length) visit(row.children);
        });
        visit(rows || []);
        return result;
    };
    const exportColumns = () => [
        ...columns.slice(0, 7),
        { field: 'color_codes', title: 'Color Codes' },
        ...columns.slice(7)
    ];
    const exportHeaders = () => exportColumns().map(column =>
        column.field === 'category_label' ? 'Category' : column.title
    );
    async function exportTableFile(options) {
        try {
            const headers = exportHeaders();
            const rows = flatMaterialRows(options.data);
            let previousCategory = '';
            const data = rows.map(row => [
                ...exportColumns().map(column => {
                    if (column.field === 'category_label') {
                        if (row.category === previousCategory) return '';
                        previousCategory = row.category;
                        return row.category;
                    }
                    return column.field === 'color_codes'
                        ? colorCodesText(row.source_color_codes)
                        : row[column.field] ?? '';
                })
            ]);
            const filename = options.filename || activeStyleNo || 'BOM';
            if (options.type === 'csv') {
                const csvCell = value => {
                    const text = String(value ?? '');
                    return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
                };
                const csv = [headers, ...data].map(row => row.map(csvCell).join(',')).join('\r\n');
                await saveFile(filename, 'csv', `\ufeff${csv}`);
                return;
            }
            const workbook = new ExcelJS.Workbook();
            const sheet = workbook.addWorksheet('BOM');
            sheet.addRow(headers);
            data.forEach(row => sheet.addRow(row));
            sheet.views = [{ state: 'frozen', ySplit: 1 }];
            sheet.columns.forEach(column => { column.width = 20; });
            const buffer = await workbook.xlsx.writeBuffer();
            await saveFile(filename, 'xlsx', new Blob([buffer], {
                type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
            }));
        } catch (error) {
            showStatus(`导出失败：${error.message}`, true);
            throw error;
        }
    }
    const parseCSV = text => {
        const records = [];
        let record = [];
        let value = '';
        let quoted = false;
        const input = text.replace(/^\uFEFF/, '');
        for (let index = 0; index < input.length; index++) {
            const char = input[index];
            if (quoted) {
                if (char === '"' && input[index + 1] === '"') {
                    value += '"';
                    index++;
                } else if (char === '"') {
                    quoted = false;
                } else {
                    value += char;
                }
            } else if (char === '"' && value.length === 0) {
                quoted = true;
            } else if (char === ',') {
                record.push(value);
                value = '';
            } else if (char === '\n' || char === '\r') {
                if (char === '\r' && input[index + 1] === '\n') index++;
                record.push(value);
                if (record.some(cell => cell !== '')) records.push(record);
                record = [];
                value = '';
            } else {
                value += char;
            }
        }
        record.push(value);
        if (record.some(cell => cell !== '')) records.push(record);
        return records;
    };
    async function readImportRows(file) {
        const headers = exportHeaders();
        const legacyHeaders = [...headers, 'Parent Row'];
        let records;
        if (/\.csv$/i.test(file.name)) {
            records = parseCSV(await file.text());
        } else {
            const workbook = new ExcelJS.Workbook();
            await workbook.xlsx.load(await file.arrayBuffer());
            const sheet = workbook.getWorksheet('BOM') || workbook.worksheets[0];
            if (!sheet) throw new Error('工作簿中没有 BOM 数据');
            records = [];
            sheet.eachRow(row => records.push(Array.from(
                { length: row.cellCount },
                (_, index) => row.getCell(index + 1).text
            )));
        }
        if (!records.length) {
            throw new Error('文件列结构不匹配，请使用表格工具栏导出的模板');
        }
        const fileHeaders = records[0].map(header => String(header ?? '').trim());
        const hasParentColumn = fileHeaders.length === legacyHeaders.length &&
            fileHeaders.every((header, index) => header === legacyHeaders[index]);
        const validHeaders = fileHeaders.length === headers.length &&
            fileHeaders.every((header, index) => header === headers[index]);
        if (!hasParentColumn && !validHeaders) {
            throw new Error('文件列结构不匹配，请使用表格工具栏导出的模板');
        }
        const columnCount = hasParentColumn ? legacyHeaders.length : headers.length;
        records = records.map(record => Array.from(
            { length: columnCount },
            (_, index) => String(record[index] ?? '')
        ));
        let previousCategory = '';
        return records.slice(1).filter(record => record.some(value => value !== '')).map(record => {
            const category = record[0].trim() || previousCategory;
            if (category) previousCategory = category;
            const parentRowValue = hasParentColumn ? record[headers.length].trim() : '';
            const item = {
                category,
                parent_row: parentRowValue ? Number(parentRowValue) : null,
                no: record[1].trim() ? Number(record[1]) : null,
                parts: record[2] || '',
                material_description: record[3] || '',
                unit: record[4] || '',
                supplier: record[5] || '',
                remark: record[6] || '',
                color: [],
                process: []
            };
            item.custom_fields = {};
            exportColumns().forEach((column, index) => {
                if (Number.isInteger(column.colorIndex)) item.color[column.colorIndex] = record[index] || '';
                else if (Number.isInteger(column.processIndex)) item.process[column.processIndex] = record[index] || '';
                else if (column.field === 'color_codes') item.color_codes = colorCodesValue(record[index]);
                else if (column.customId) item.custom_fields[column.customId] = record[index] || '';
            });
            return item;
        });
    }
    function validateImportRows(rows) {
        const allowedCategories = new Set(categoryNames.map(([value]) => value));
        const invalidCategory = rows.findIndex(row => !allowedCategories.has(row.category));
        if (invalidCategory >= 0) throw new Error(`第 ${invalidCategory + 2} 行的分类无效`);
        const invalidNumber = rows.findIndex(row => row.no !== null &&
            (!Number.isInteger(row.no) || row.no < 1 || row.no > 999999));
        if (invalidNumber >= 0) throw new Error(`第 ${invalidNumber + 2} 行的 No. 必须是 1–999999 的整数`);
        const invalidParent = rows.findIndex((row, index) => row.parent_row !== null &&
            (!Number.isInteger(row.parent_row) || row.parent_row < 1 || row.parent_row > index ||
                rows[row.parent_row - 1].category !== row.category));
        if (invalidParent >= 0) throw new Error(`第 ${invalidParent + 2} 行的父级行号无效或分类不一致`);
    }

    function draftItemsFromImport(rows) {
        const itemIDs = [];
        const nextOrder = new Map();
        return rows.map(item => {
            const itemID = nextDraftItemID--;
            itemIDs.push(itemID);
            const parentID = item.parent_row === null ? null : itemIDs[item.parent_row - 1];
            const orderKey = `${item.category}:${parentID ?? 0}`;
            const sortOrder = nextOrder.get(orderKey) || 0;
            nextOrder.set(orderKey, sortOrder + 1);
            return {
                item_id: itemID,
                category: item.category,
                parent_id: parentID,
                sort_order: sortOrder,
                no: item.no,
                parts: item.parts,
                material_description: item.material_description,

            };
        });
    }
    async function importTableFile({ file }) {

    function displayRows(items) {
        const labels = Object.fromEntries(categoryNames);
        const rowsByID = new Map();
        (items || []).forEach(item => {
            const row = {
                ...item,
                row_key: `item-${item.item_id}`,
                category_label: '',
                source_color_codes: Array.isArray(item.color_codes) ? [...item.color_codes] : [],
                color_codes: '',
                no: item.no ?? '',
                children: []
            };
            for (let index = 0; index < colorColumnCount; index++) {
                row[`color_${index}`] = item.color?.[index] || '';
                row[`process_${index}`] = item.process?.[index] || '';
            }
            customColumns.forEach(column => {
                row[`custom_${column.id}`] = item.custom_fields?.[column.id] || '';
            });
            rowsByID.set(row.item_id, row);
        });
        const colorCodes = upperColorCodes(items);
        const categoryRows = categoryNames
            .filter(([category]) => activeComponents.includes(category))
            .map(([category]) => {
                const categoryItems = [...rowsByID.values()]
                    .filter(item => item.category === category)
                    .sort((left, right) => left.sort_order - right.sort_order || left.item_id - right.item_id);
                const roots = [];
                categoryItems.forEach(row => {
                    const parent = rowsByID.get(row.parent_id);
                    if (parent?.category === category) parent.children.push(row);
                    else roots.push(row);
                });
                const sortChildren = rows => rows.forEach(row => {
                    row.children.sort((left, right) =>
                        left.sort_order - right.sort_order || left.item_id - right.item_id
                    );
                    sortChildren(row.children);
                });
                sortChildren(roots);
                return {
                    row_key: `category-${category}`,
                    category,
                    category_label: labels[category],
                    isCategory: true,
                    children: roots
                };
            });
        return [{
            row_key: 'color-codes-summary',
            category: 'upper',
            category_label: 'Color Codes',
            isCategory: true,
            isColorCodesSummary: true,
            ...Object.fromEntries(Array.from(
                { length: colorColumnCount },

    async function saveCustomColumn(column, paste = false) {
        const position = column ? columns.indexOf(column) + 1 : columns.length;
        const values = new Map((paste ? clipboardColumn.values : [])
            .map(item => [item.item_id, item.value]));
        const newColumn = {
            id: crypto.randomUUID(),
            title: paste ? clipboardColumn.title : `自定义列 ${customColumns.length + 1}`,
            position
        };
        const metadata = customColumns.map(item => ({
            ...item,
            position: item.position >= position ? item.position + 1 : item.position
        }));
        metadata.push(newColumn);
        syncCustomColumns(metadata);
        flatMaterialRows(gridState.rows).forEach(row => {
            row[`custom_${newColumn.id}`] = values.get(row.item_id) || '';
        });
        markUnsavedChanges(values.size ? '已复制并粘贴整列，点击“确认保存”后写入数据库' :
            '已添加自定义列，点击“确认保存”后写入数据库');

    function snapshotMaterialTree(root) {
        const snapshot = [];
        const visit = (row, parentIndex = null) => {
            const index = snapshot.length;
            snapshot.push({
                parent_index: parentIndex,
                no: row.no === '' ? null : row.no,
                parts: row.parts || '',
                material_description: row.material_description || '',
                unit: row.unit || '',
                remark: row.remark || '',
                supplier: row.supplier || '',
                color_codes: [...(row.source_color_codes || [])],
                color: Array.from({ length: colorColumnCount }, (_, i) => row[`color_${i}`] || ''),
                process: Array.from({ length: colorColumnCount }, (_, i) => row[`process_${i}`] || ''),
                custom_fields: Object.fromEntries(customColumns.map(column =>
                    [column.id, row[`custom_${column.id}`] || '']
                ))
            });
            (row.children || []).forEach(child => visit(child, index));
        };
        visit(root);
        return snapshot;
    }
    const firstRootRow = category => gridState.rows.find(item => item.category === category)?.children?.[0] || null;
    function nextSiblingRow(row) {
        const parent = row.parent_id
            ? flatMaterialRows(gridState.rows).find(item => item.item_id === row.parent_id)
            : gridState.rows.find(item => item.category === row.category);
        const siblings = parent?.children;
        if (!siblings) return null;
        const index = siblings.findIndex(item => item.item_id === row.item_id);
        return siblings[index + 1] || null;
    }
    function findMaterialRow(itemID) {
        return flatMaterialRows(gridState.rows).find(item => item.item_id === itemID) || null;
    }
    function insertDraftRows(category, parentID, beforeItemID, snapshots) {
        const parent = parentID === null ? null : findMaterialRow(parentID);
        const categoryRow = gridState.rows.find(item => item.isCategory && item.category === category);
        const siblings = parent ? parent.children : categoryRow?.children;
        if (!siblings) throw new Error('找不到目标分类或父级行');
        const created = [];
        const roots = [];
        snapshots.forEach((item, index) => {
            const itemID = nextDraftItemID--;
            const parentRow = item.parent_index === null ? null : created[item.parent_index];
            const row = {
                ...item,
                item_id: itemID,
                row_key: `draft-${Math.abs(itemID)}`,
                category,
                category_label: '',
                parent_id: parentRow?.item_id ?? parentID,
                sort_order: index,
                no: item.no ?? '',
                source_color_codes: [...(item.color_codes || [])],
                color_codes: '',
                children: []
            };
            for (let colorIndex = 0; colorIndex < colorColumnCount; colorIndex++) {
                row[`color_${colorIndex}`] = item.color?.[colorIndex] || '';
                row[`process_${colorIndex}`] = item.process?.[colorIndex] || '';
            }
            customColumns.forEach(column => {
                row[`custom_${column.id}`] = item.custom_fields?.[column.id] || '';
            });
            created.push(row);
            if (parentRow) parentRow.children.push(row);
            else roots.push(row);
        });
        const targetIndex = beforeItemID === null
            ? siblings.length
            : siblings.findIndex(item => item.item_id === beforeItemID);
        siblings.splice(targetIndex < 0 ? siblings.length : targetIndex, 0, ...roots);
    }
    async function addMaterialRow(row) {
        const category = row?.category || currentCategory();
        const parentID = row?.item_id ? row.parent_id ?? null : null;
        let beforeItemID = null;
        if (row?.item_id) {
            beforeItemID = nextSiblingRow(row)?.item_id ?? null;
        } else if (row?.isCategory) {
            beforeItemID = firstRootRow(category)?.item_id ?? null;
        }
        insertDraftRows(category, parentID, beforeItemID, [{
            parent_index: null,
            no: null,
            parts: '',
            material_description: '',
            unit: '',
            remark: '',
            supplier: '',
            color_codes: [],
            color: [],
            process: [],
            custom_fields: {}
        }]);
        markUnsavedChanges('已新增物料行，点击“确认保存”后写入数据库');
    }
    async function addNodeRow(row) {
        const category = row?.category || currentCategory();
        const parentID = row?.item_id ?? null;
        const beforeItemID = row?.item_id
            ? row.children?.[0]?.item_id ?? null
            : firstRootRow(category)?.item_id ?? null;
        insertDraftRows(category, parentID, beforeItemID, [{
            parent_index: null,
            no: null,
            parts: '',
            material_description: '',
            unit: '',
            remark: '',
            supplier: '',
            color_codes: [],
            color: [],
            process: [],
            custom_fields: {}
        }]);
        markUnsavedChanges(parentID
            ? '已新增子节点行，点击“确认保存”后写入数据库'
            : '已新增节点行，点击“确认保存”后写入数据库');
    }
    async function pasteRows(row) {
        if (!clipboardRows?.length) return;
        const category = row?.category || currentCategory();
        const parentID = row?.item_id ? row.parent_id ?? null : null;
        let beforeItemID = null;
        if (row?.item_id) {
            beforeItemID = row.item_id;
        } else if (row?.isCategory) {
            beforeItemID = firstRootRow(category)?.item_id ?? null;
        }
        insertDraftRows(category, parentID, beforeItemID, clipboardRows);
        markUnsavedChanges(`已粘贴 ${clipboardRows.length} 行（含子行），点击“确认保存”后写入数据库`);
    }
    async function deleteMaterialRow(row) {
        if (!isMaterialRow(row)) return;
        const target = findMaterialRowByKey(row.row_key) ||
            flatMaterialRows(gridState.rows).find(item => item.item_id === row.item_id);
        if (!target) throw new Error('找不到要删除的物料行');
        const descendantCount = flatMaterialRows(target.children || []).length;
        const description = descendantCount
            ? `该节点包含 ${descendantCount} 条子行，确定删除本行及所有子行吗？`
            : '确定删除选中的物料行吗？';
        if (!confirm(description)) return;
        const parent = target.parent_id ? findMaterialRow(target.parent_id) : null;
        const siblings = parent
            ? parent.children
            : gridState.rows.find(item => item.isCategory && item.category === target.category)?.children;
        const rowIndex = siblings?.findIndex(item => item.row_key === target.row_key) ?? -1;
        if (rowIndex < 0) throw new Error('找不到要删除的物料行');
        siblings.splice(rowIndex, 1);
        markUnsavedChanges('已删除物料行，点击“确认保存”后同步数据库');
    }
    rowContextMenu.addEventListener('click', event => {
        const action = event.target.closest('[data-action]')?.dataset.action;
        if (!action) return;
        if (action === 'add-component') {
            hideRowContextMenu();
            refreshComponentOptions();
            document.getElementById('component-backdrop').hidden = false;
            document.getElementById('component-select').focus();
            return;
        }
        if (action === 'delete-component') {
            const category = contextRow?.category || currentCategory();
            hideRowContextMenu();
            if (activeComponents.includes(category)) deleteComponent(category);
            return;
        }
        if (action === 'copy' && isMaterialRow(contextRow)) {
            clipboardRows = snapshotMaterialTree(contextRow);
            rowContextMenu.querySelector('[data-action="paste"]').disabled = false;
            showStatus(`已复制 ${clipboardRows.length} 行（含子行）`);
            hideRowContextMenu();
            return;
        }
        const operations = {
            'add-row': addMaterialRow,
            'add-node': addNodeRow,
            paste: pasteRows,
            delete: deleteMaterialRow
        };
        const operation = operations[action];
        const selectedRow = contextRow;
        hideRowContextMenu();
        if (operation) operation(selectedRow).catch(error => showStatus(`行操作失败：${error.message}`, true));
    });

    async function loadStyles(prefix = document.getElementById('search-prefix').value) {
        listStatus.textContent = '正在读取 PostgreSQL 数据…';
        const result = await fetchJSON(`/api/bom/list?q=${encodeURIComponent(prefix)}`);
        styleList.replaceChildren();
        result.items.forEach(item => {
            const button = document.createElement('button');
            button.className = `style-option${item.style_no === activeStyleNo ? ' active' : ''}`;
            button.type = 'button';
            button.dataset.styleNo = item.style_no;
            const styleNo = document.createElement('span');
            styleNo.textContent = item.style_no;
            const brand = document.createElement('span');
            brand.className = 'style-option-brand';
            brand.textContent = item.brand || '';
            button.replaceChildren(styleNo, brand);
            button.addEventListener('click', () => {
                if (hasUnsavedChanges &&
                    !confirm('当前页面有未保存的修改，切换鞋款将放弃这些修改。继续吗？')) return;
                discardUnsavedChanges();
                activeStyleNo = item.style_no;
                history.pushState(null, '', styleURL(activeStyleNo));
                loadCurrentStyle().catch(error => showStatus(error.message, true));
                loadStyles().catch(error => showStatus(error.message, true));
            });
            styleList.appendChild(button);
        });
        listStatus.textContent = result.items.length ? `${result.items.length} 个鞋款` : '没有匹配的鞋款';
    }

    async function loadCurrentStyle() {
        if (hasUnsavedChanges) throw new Error('当前鞋款有未保存的修改');
        if (!activeStyleNo) {
            gridState.rows = [];
            savedRowValues.clear();
            activeComponents.splice(0);
            updateSaveButton();
            return;
        }
        showStatus('正在加载鞋款…');
        const [header, matrix] = await Promise.all([
            fetchJSON(`/api/bom/header?${bomQuery()}`),
            fetchJSON(`/api/bom/matrix?${bomQuery()}`)
        ]);
        savedColorCodeValues = upperColorCodes(matrix.data);
        const components = Array.isArray(matrix.components) ? matrix.components : categoryNames.map(([value]) => value);
        if (validateCategoryList(components)) {
            activeComponents.splice(0, activeComponents.length, ...components);
        } else {
            throw new Error('数据库组件清单包含无效分类');
        }
        draftColumnTitles = { ...savedColumnTitles };
        savedHeader = {};
        headerDefinitions.forEach(([field]) => {
            const input = fieldInput(field);
            input.value = header[field] || '';
            input.disabled = false;
            savedHeader[field] = input.value;
        });
        syncCustomColumns(matrix.custom_columns || [], matrix.hidden_columns || []);
        gridState.rows = displayRows(matrix.data || []);
        savedRowValues = new Map(flatMaterialRows(gridState.rows).map(row => [
            row.item_id,
            Object.fromEntries(editableFields().map(field => [field, row[field] ?? '']))
        ]));
        document.title = `${header.style_no} - ${header.style_name || 'BOM'}`;
        updateSaveButton();
        showStatus(`${flatMaterialRows(gridState.rows).length} 行物料已加载`);
    }

    async function persistEditedCell({ row, column }) {
        if (!row) return;
        if (row.isColorCodesSummary) {
            const columnConfig = columns.find(item => item.field === column?.field);
            if (!Number.isInteger(columnConfig?.colorIndex)) return;
            const index = columnConfig.colorIndex;
            const value = String(row[columnConfig.field] ?? '').trim();
            if (value === String(savedColorCodeValues[index] ?? '').trim()) return;
            const colorCodes = Array.from({ length: colorColumnCount }, (_, colorIndex) =>
                String(row[`color_${colorIndex}`] ?? '').trim());
            while (colorCodes.length && !colorCodes[colorCodes.length - 1]) colorCodes.pop();
            let upperRows = flatMaterialRows(gridState.rows).filter(item => item.category === 'upper');
            if (!upperRows.length) {
                insertDraftRows('upper', null, null, [{
                    parent_index: null,
                    no: null,
                    parts: '',
                    material_description: '',
                    unit: '',
                    remark: '',
                    supplier: '',
                    color_codes: colorCodes,
                    color: [],
                    process: [],
                    custom_fields: {}
                }]);
                upperRows = flatMaterialRows(gridState.rows).filter(item => item.category === 'upper');
            }
            upperRows.forEach(item => { item.source_color_codes = [...colorCodes]; });
            markUnsavedChanges('Color Codes 已修改，点击“确认保存”后同步数据库');
            return;
        }
        if (!row.item_id) return;
        const snapshot = savedRowValues.get(row.item_id) || {};
        const currentEditableFields = editableFields();
        const candidateFields = gridState.editMode === 'row' ? currentEditableFields : [column?.field];
        const changedFields = candidateFields.filter(field =>
            currentEditableFields.includes(field) &&
            !Object.is(row[field] ?? '', snapshot[field] ?? '')
        );
        if (!changedFields.length) return;
        try {
            await gridTable.validateField(row, changedFields);
        } catch (error) {
            showStatus(`物料编号校验未通过：${error.message || '请修正后再保存'}`, true);
            return;
        }
        markUnsavedChanges('物料已修改，点击“确认保存”后写入数据库');
    }

    async function saveHeader(input) {
        const field = input.dataset.field;
        const previous = savedHeader[field];
        const value = input.value.trim();
        if (value === previous) return;
        markUnsavedChanges(`表头「${field}」已修改，点击“确认保存”后写入数据库`);
    }
    document.querySelectorAll('#header-fields input').forEach(input =>
        input.addEventListener('input', () => saveHeader(input)));

    function serializeDraftRows() {
        const materialRows = flatMaterialRows(gridState.rows);
        const rowNumbers = new Map(materialRows.map((row, index) => [row.item_id, index + 1]));
        return materialRows.map(row => {
            const no = row.no === '' || row.no === null || row.no === undefined
                ? null
                : Number(row.no);
            return {
                category: row.category,
                parent_row: row.parent_id ? rowNumbers.get(row.parent_id) ?? null : null,
                no,
                parts: String(row.parts ?? ''),
                material_description: String(row.material_description ?? ''),
                unit: String(row.unit ?? ''),
                supplier: String(row.supplier ?? ''),
                remark: String(row.remark ?? ''),
                color_codes: [...(row.source_color_codes || [])],
                color: Array.from({ length: colorColumnCount }, (_, index) =>
                    String(row[`color_${index}`] ?? '')),
                process: Array.from({ length: colorColumnCount }, (_, index) =>
                    String(row[`process_${index}`] ?? '')),
                custom_fields: Object.fromEntries(customColumns.map(column =>
                    [column.id, String(row[`custom_${column.id}`] ?? '')]
                ))
            };
        });
    }
    async function saveDraft() {
        if (!activeStyleNo || isSavingDraft) return;
        isSavingDraft = true;
        updateSaveButton();
        let databaseSaved = false;
        const previousTitles = { ...savedColumnTitles };
        let previousStorage = null;
        let columnTitlesUpdated = false;
        try {
            await new Promise(resolve => window.setTimeout(resolve, 0));
            if (!hasUnsavedChanges) {
                showStatus('没有待保存的修改');
                return;
            }
            await Promise.all(flatMaterialRows(gridState.rows).map(row =>
                gridTable.validateField(row, ['no'])
            ));
            const rows = serializeDraftRows();
            validateImportRows(rows);
            const header = Object.fromEntries(headerDefinitions.map(([field]) =>
                [field, fieldInput(field).value.trim()]));
            if (!header.style_no) throw new Error('Style No. 不能为空');

            previousStorage = localStorage.getItem(columnTitleStorageKey);
            const nextTitles = { ...savedColumnTitles, ...draftColumnTitles };
            localStorage.setItem(columnTitleStorageKey, JSON.stringify(nextTitles));
            columnTitlesUpdated = true;
            savedColumnTitles = nextTitles;
            await queueWrite(() => postJSON('/api/bom/import', {
                header,
                rows,
                custom_columns: customColumns.map(column => ({ ...column })),
                hidden_columns: [...hiddenBuiltInColumns],
                components: [...activeComponents]
            }));
            databaseSaved = true;
            activeStyleNo = header.style_no;
            history.replaceState(null, '', styleURL(activeStyleNo));
            discardUnsavedChanges();
            await Promise.all([loadStyles(), loadCurrentStyle()]);
            showStatus(`已确认保存 ${rows.length} 行物料及表头到数据库`);
        } catch (error) {
            if (!databaseSaved && columnTitlesUpdated) {
                savedColumnTitles = previousTitles;
                try {
                    if (previousStorage === null) localStorage.removeItem(columnTitleStorageKey);
                    else localStorage.setItem(columnTitleStorageKey, previousStorage);
                } catch (storageError) {
                    showStatus(`保存未完成：${error.message}；恢复本地列名失败：${storageError.message}`, true);
                    updateSaveButton();
                    return;
                }
            }
            if (databaseSaved) {
                discardUnsavedChanges();
                showStatus(`数据库已保存，但刷新页面数据失败：${error.message}`, true);
            } else {
                showStatus(`确认保存失败，修改仍保留在页面：${error.message}`, true);
            }
        } finally {
            isSavingDraft = false;
            updateSaveButton();
        }
    }
    confirmSaveButton.addEventListener('click', () => {
        saveDraft().catch(error => {
            updateSaveButton();
            showStatus(`确认保存失败：${error.message}`, true);
        });
    });

    document.getElementById('search-form').addEventListener('submit', event => {
        event.preventDefault();
        loadStyles().catch(error => {
            listStatus.textContent = `搜索失败：${error.message}`;
        });
    });

    document.getElementById('create-style').addEventListener('click', () => {
        if (hasUnsavedChanges &&
            !confirm('当前页面有未保存的修改，新增鞋款前将放弃这些修改。继续吗？')) return;
        discardUnsavedChanges();
        document.getElementById('create-form').reset();
        document.getElementById('create-backdrop').hidden = false;
        createStyleNoInput.focus();
    });
    document.getElementById('cancel-create').addEventListener('click', () => {
        document.getElementById('create-backdrop').hidden = true;
    });
    document.getElementById('create-form').addEventListener('submit', async event => {
        event.preventDefault();
        const header = Object.fromEntries(
            [...document.querySelectorAll('#create-fields input')].map(input => [input.dataset.field, input.value.trim()])
        );
        try {
            const result = await fetchJSON('/api/bom/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ header })
            });
            activeStyleNo = result.style_no;
            history.pushState(null, '', styleURL(activeStyleNo));
            document.getElementById('create-backdrop').hidden = true;
            await loadStyles();
            await loadCurrentStyle();
        } catch (error) {
            showStatus(`新增鞋款失败：${error.message}`, true);
        }
    });

    document.getElementById('delete-style').addEventListener('click', async () => {
        if (!activeStyleNo || !confirm(`确定永久删除 ${activeStyleNo} 的全部鞋款、物料及签核数据吗？`)) return;
        if (hasUnsavedChanges &&
            !confirm('当前页面有未保存的修改，删除鞋款会一并放弃这些修改。继续吗？')) return;
        discardUnsavedChanges();
        try {
            await queueWrite(() => postJSON('/api/bom/delete', {}));
            activeStyleNo = '';
            history.replaceState(null, '', location.pathname);
            await loadStyles();
            await loadCurrentStyle();
            showStatus('鞋款数据已删除');
        } catch (error) {
            showStatus(`删除鞋款失败：${error.message}`, true);
        }
    });

    document.getElementById('edit-mode').addEventListener('change', event => {
        gridState.editMode = event.target.value;
    });
    document.getElementById('import-table').addEventListener('click', () => {
        if (!activeStyleNo) {
            showStatus('请先选择鞋款', true);
            return;
        }
        gridTable.importData({
            types: ['xlsx', 'csv'],
            remote: true,
            message: false,
            importMethod: importTableFile
        }).catch(error => showStatus(`导入失败：${error.message || '文件未能处理'}`, true));
    });

    const exportCurrentTable = async type => {
        if (!activeStyleNo) {
            showStatus('请先选择鞋款', true);
            return;
        }
        try {
            await exportTableFile({
                data: gridState.rows,
                filename: activeStyleNo,
                type
            });
            showStatus(`已导出 ${type === 'xlsx' ? 'Excel' : 'CSV'}`);
        } catch (error) {
            showStatus(`导出失败：${error.message}`, true);
        }
    };
    const exportBackdrop = document.getElementById('export-backdrop');
    document.getElementById('export-table').addEventListener('click', () => {
        if (!activeStyleNo) {
            showStatus('请先选择鞋款', true);
            return;
        }
        exportBackdrop.hidden = false;
        document.getElementById('export-format').focus();
    });
    document.getElementById('cancel-export').addEventListener('click', () => {
        exportBackdrop.hidden = true;
    });
    document.getElementById('export-form').addEventListener('submit', async event => {
        event.preventDefault();
        exportBackdrop.hidden = true;
        await exportCurrentTable(document.getElementById('export-format').value);
    });

    async function start() {
        try {
            const prefix = new URL(location.href).searchParams.get('q') || '';
            document.getElementById('search-prefix').value = prefix;
            await loadStyles(prefix);
            const available = [...styleList.querySelectorAll('.style-option')];
            if (!activeStyleNo && available.length) {
                activeStyleNo = available[0].dataset.styleNo;
                history.replaceState(null, '', styleURL(activeStyleNo));
            }
            if (activeStyleNo) await loadCurrentStyle();
            window.setInterval(() => loadStyles().catch(error => {
                listStatus.textContent = `刷新列表失败：${error.message}`;
            }), 10000);
        } catch (error) {
            showStatus(`初始化失败：${error.message}`, true);
            listStatus.textContent = '请检查 PostgreSQL 连接和现有表结构';
        }
    }
    window.addEventListener('popstate', () => {
        if (hasUnsavedChanges &&
            !confirm('当前页面有未保存的修改，离开将放弃这些修改。继续吗？')) {
            history.pushState(null, '', styleURL(activeStyleNo));
            return;
        }
        discardUnsavedChanges();
        activeStyleNo = new URL(location.href).searchParams.get('bom_id') || '';
        loadCurrentStyle().catch(error => showStatus(error.message, true));
        loadStyles().catch(error => showStatus(error.message, true));
    });
    window.addEventListener('beforeunload', event => {
        if (!hasUnsavedChanges) return;
        event.preventDefault();
        event.returnValue = '';
    });
    start();
})();
</script>
</body>
</html>
