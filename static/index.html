<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PRO WELL (VIETNAM) CO.,LTD - 鞋款多配色 BOM 展开矩阵 (VTable 企业级高性能版)</title>
    <!-- 1. 引入字节跳动开源 VTable 核心库 -->
    <script src="https://cdn.jsdelivr.net/npm/@visactor/vtable@latest/dist/vtable.min.js"></script>
    <!-- 2. 引入 VTable 编辑器插件 -->
    <script src="https://cdn.jsdelivr.net/npm/@visactor/vtable-editors@latest/dist/vtable-editors.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 15px; background-color: #f4f6f9; color: #333; font-size: 13px; }
        .bom-container { background: #fff; padding: 20px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 98%; margin: 0 auto; }
        
        /* 顶部表头样式 */
        .company-title { font-size: 16px; font-weight: bold; color: #222; outline: none; }
        .doc-title { font-size: 18px; font-weight: bold; text-align: center; color: #000; margin: 10px 0; outline: none; }
        .info-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 12px; }
        .info-table td { border: 1px solid #ccc; padding: 5px 8px; background: #fafafa; }
        .info-label { font-weight: bold; color: #555; width: 15%; }
        .info-val { color: #000; width: 35%; outline: none; background: #fff; }
        .info-val:focus { background: #eef4ff; border: 1px solid #3b82f6; }

        /* 底部表尾签名样式 */
        .excel-footer { width: 100%; margin-top: 20px; border-collapse: collapse; font-size: 13px; }
        .excel-footer td { padding: 15px 10px; border: 1px solid #ccc; outline: none; background: #fafafa; width: 33.33%; }
        .excel-footer td:focus { background: #eef4ff; }

        #tableContainer { width: 100%; height: 600px; margin-bottom: 15px; border: 1px solid #e5e7eb; }
        
        .toolbar { margin-bottom: 10px; display: flex; gap: 10px; align-items: center; }
        .btn { padding: 6px 14px; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #1d4ed8; }
        .status-tip { color: #059669; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

    <div class="bom-container">
        <!-- 1. 顶部可编辑表头 -->
        <div class="company-title" contenteditable="true">PRO WELL (VIETNAM) CO.,LTD</div>
        <div class="doc-title" contenteditable="true">樣品單-多配色</div>

        <table class="info-table">
            <tr>
                <td class="info-label">Sample Order No.:</td>
                <td class="info-val" contenteditable="true" id="val-order-no">260915009</td>
                <td class="info-label">Sample Type:</td>
                <td class="info-val" contenteditable="true">CFM 確認樣</td>
            </tr>
            <tr>
                <td class="info-label">Customer:</td>
                <td class="info-val" contenteditable="true">-</td>
                <td class="info-label">Season：</td>
                <td class="info-val" contenteditable="true">FW27</td>
            </tr>
            <tr>
                <td class="info-label">Brand：</td>
                <td class="info-val" contenteditable="true">-</td>
                <td class="info-label">Gender:</td>
                <td class="info-val" contenteditable="true">W'S US</td>
            </tr>
            <tr>
                <td class="info-label">Style No.：</td>
                <td class="info-val" contenteditable="true" id="val-style-no">ON-27Q3-094W</td>
                <td class="info-label">Style Name:</td>
                <td class="info-val" contenteditable="true" id="val-style-name">CLOUDMUSE SENSA</td>
            </tr>
            <tr>
                <td class="info-label">Last No.：</td>
                <td class="info-val" contenteditable="true">21-009-W-LOW</td>
                <td class="info-label">Bottom No.：</td>
                <td class="info-val" contenteditable="true">ON180-PT</td>
            </tr>
            <tr>
                <td class="info-label">Shoetype：</td>
                <td class="info-val" contenteditable="true" colspan="3">PAD PERFORMANCE ALL DAY</td>
            </tr>
        </table>

        <!-- 操作工具栏 -->
        <div class="toolbar">
            <button class="btn" id="save-btn">💾 保存状态确认</button>
            <span class="status-tip" id="status-tip"></span>
        </div>

        <!-- 2. VTable 表格容器 -->
        <div id="tableContainer"></div>

        <!-- 3. 底部可编辑表尾签名栏 -->
        <table class="excel-footer">
            <tr>
                <td contenteditable="true"><strong>核准：</strong></td>
                <td contenteditable="true"><strong>審核人：</strong></td>
                <td contenteditable="true"><strong>制表人：</strong></td>
            </tr>
        </table>
    </div>

    <script>
        let tableInstance = null;

        // 加载头部基础信息
        fetch('/api/bom/header')
            .then(res => res.json())
            .then(headerData => {
                if (headerData.style_name) {
                    document.getElementById('val-order-no').innerText = headerData.sample_order_no || '';
                    document.getElementById('val-style-no').innerText = headerData.style_no || '';
                    document.getElementById('val-style-name').innerText = headerData.style_name || '';
                }
            }).catch(err => console.log("加载头部信息提示:", err));

        // 加载矩阵数据并渲染 VTable
        fetch('/api/bom/matrix')
            .then(res => res.json())
            .then(resData => {
                // 注册 VTable 输入编辑器
                const inputEditor = new VTable.editors.InputEditor();
                VTable.registerEditor('inputEditor', inputEditor);

                let columns = [
                    { field: 'part_name', title: 'Parts (部件)', width: 140, locked: true },
                    { field: 'material_desc', title: 'Material Description', width: 320, locked: true },
                    { field: 'unit', title: 'Unit', width: 70, locked: true }
                ];

                let colorCodesList = resData.columns || [];
                let colorColumnsMap = {}; // 记录配色列对应关系

                if (colorCodesList.length > 0) {
                    colorCodesList.forEach(code => {
                        let colorField = code + '_color';
                        let processField = code + '_process';
                        colorColumnsMap[colorField] = code;

                        columns.push({
                            field: colorField,
                            title: code,
                            width: 220,
                            editor: 'inputEditor'
                        });
                        columns.push({
                            field: processField,
                            title: 'Process',
                            width: 220,
                            editor: 'inputEditor'
                        });
                    });
                }

                let records = [];
                if (resData.data && resData.data.length > 0) {
                    records = resData.data.map(item => {
                        let row = {
                            item_id: item.item_id,
                            part_name: item.part_name || '',
                            material_desc: item.material_desc || '',
                            unit: item.unit || ''
                        };

                        colorCodesList.forEach(code => {
                            let detail = (item.color_details && item.color_details[code]) || {};
                            row[code + '_color'] = detail.color_desc || '';
                            row[code + '_process'] = detail.process_desc || '';
                        });
                        return row;
                    });
                }

                const option = {
                    container: document.getElementById('tableContainer'),
                    records: records,
                    columns: columns,
                    autoWrapText: true,
                    headerRowHeight: 40,
                    rowHeight: 35,
                    frozenColCount: 3,
                    editCellTrigger: ['dblclick'], // 双击单元格编辑
                    allowFrozenColResize: true
                };

                tableInstance = new VTable.ListTable(option);

                // 1. 监听单元格修改完成事件，实时同步到 MariaDB 数据库
                tableInstance.on('change_cell_value', (args) => {
                    const { col, row, value, oldValue } = args;
                    if (value === oldValue) return;

                    const field = columns[col] ? columns[col].field : '';
                    const record = records[row - 1]; // row 0 为表头
                    if (!record) return;

                    let colorCode = "";
                    let fieldType = "";

                    if (field.endsWith('_color')) {
                        colorCode = field.replace('_color', '');
                        fieldType = 'color';
                    } else if (field.endsWith('_process')) {
                        colorCode = field.replace('_process', '');
                        fieldType = 'process';
                    }

                    if (colorCode && fieldType) {
                        fetch('/api/bom/update-cell', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                item_id: record.item_id,
                                color_code: colorCode,
                                field_type: fieldType,
                                value: value
                            })
                        })
                        .then(res => res.json())
                        .then(result => {
                            const tip = document.getElementById('status-tip');
                            tip.innerText = `✓ 数据库实时同步成功 (物料ID: ${record.item_id})`;
                            setTimeout(() => { tip.innerText = ""; }, 3000);
                        })
                        .catch(err => {
                            console.error("单元格实时同步失败:", err);
                        });
                    }
                });

                // 2. 右键单击表头：弹出功能选项（编辑列名、左侧/右侧插入列、删除当前列）并实时同步数据库
                const containerEl = document.getElementById('tableContainer');
                containerEl.addEventListener('contextmenu', (e) => {
                    const cellInfo = tableInstance.getCellAt(e.clientX, e.clientY);
                    if (cellInfo && cellInfo.row === 0) { // 点击表头行
                        const col = cellInfo.col;
                        const field = columns[col] ? columns[col].field : '';
                        
                        // 仅允许在动态配色列头或 Process 列头右键
                        if (field && !['part_name', 'material_desc', 'unit'].includes(field)) {
                            e.preventDefault();
                            let currentTitle = columns[col].title;
                            
                            let action = prompt(`请选择对列 [${currentTitle}] 的操作：\n1. 编辑列名\n2. 左侧插入列\n3. 右侧插入列\n4. 删除当前列\n\n请输入数字 (1-4):`, "1");
                            
                            if (action === "1") {
                                let newName = prompt(`请输入列 [${currentTitle}] 的新名称：`, currentTitle);
                                if (newName && newName.trim() !== "" && newName !== currentTitle) {
                                    let trimmedName = newName.trim();
                                    
                                    // 确定关联的配色代码
                                    let targetCode = currentTitle;
                                    if (field.endsWith('_process')) {
                                        targetCode = colorColumnsMap[field.replace('_process', '_color')] || currentTitle;
                                    }

                                    fetch('/api/bom/update-column', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ old_code: targetCode, new_code: trimmedName })
                                    })
                                    .then(res => res.json())
                                    .then(() => {
                                        const tip = document.getElementById('status-tip');
                                        tip.innerText = `✓ 列名已更新并同步至数据库！`;
                                        setTimeout(() => { location.reload(); }, 1000);
                                    });
                                }
                            } else if (action === "2" || action === "3") {
                                let newCode = prompt("请输入新配色代码：", "3WH" + Math.floor(Math.random()*90000000+10000000));
                                if (newCode && newCode.trim() !== "") {
                                    fetch('/api/bom/add-column', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ color_code: newCode.trim() })
                                    })
                                    .then(res => res.json())
                                    .then(() => { location.reload(); });
                                }
                            } else if (action === "4") {
                                if (confirm(`确定要删除列 [${currentTitle}] 及其关联数据吗？`)) {
                                    let targetCode = currentTitle;
                                    if (field.endsWith('_process')) {
                                        let baseField = field.replace('_process', '_color');
                                        targetCode = colorColumnsMap[baseField] || currentTitle;
                                    }

                                    fetch('/api/bom/delete-column', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ color_code: targetCode })
                                    })
                                    .then(res => res.json())
                                    .then(() => { location.reload(); });
                                }
                            }
                        }
                    }
                });

            })
            .catch(err => {
                console.error("加载 BOM 矩阵数据失败:", err);
                alert("加载 BOM 矩阵数据失败，请检查控制台。");
            });

        document.getElementById('save-btn').addEventListener('click', () => {
            const tip = document.getElementById('status-tip');
            tip.innerText = "✓ 所有编辑已实时同步至数据库！";
            setTimeout(() => { tip.innerText = ""; }, 4000);
        });
    </script>
</body>
</html>
