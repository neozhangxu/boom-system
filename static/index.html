<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PRO WELL (VIETNAM) CO.,LTD - 鞋款多配色 BOM 展开矩阵 (VTable)</title>
    <script src="https://cdn.jsdelivr.net/npm/@visactor/vtable@latest/dist/vtable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@visactor/vtable-editors@latest/dist/vtable-editors.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 15px; background-color: #f4f6f9; color: #333; font-size: 13px; }
        .bom-container { background: #fff; padding: 20px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 98%; margin: 0 auto; }
        
        .company-title { font-size: 16px; font-weight: bold; color: #222; outline: none; }
        .doc-title { font-size: 18px; font-weight: bold; text-align: center; color: #000; margin: 10px 0; outline: none; }
        .info-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 12px; }
        .info-table td { border: 1px solid #ccc; padding: 5px 8px; background: #fafafa; }
        .info-label { font-weight: bold; color: #555; width: 15%; }
        .info-val { color: #000; width: 35%; outline: none; background: #fff; }
        .info-val:focus { background: #eef4ff; border: 1px solid #3b82f6; }

        .excel-footer { width: 100%; margin-top: 20px; border-collapse: collapse; font-size: 13px; }
        .excel-footer td { padding: 15px 10px; border: 1px solid #ccc; outline: none; background: #fafafa; width: 33.33%; }
        .excel-footer td:focus { background: #eef4ff; }

        #bom-table { width: 100%; height: 600px; margin-bottom: 15px; border: 1px solid #ccc; }
        #bom-context-menu { position: fixed; z-index: 10000; display: none; min-width: 170px; padding: 4px; background: #fff; border: 1px solid #d1d5db; border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
        #bom-context-menu button { display: block; width: 100%; padding: 8px 12px; border: 0; border-radius: 4px; background: transparent; color: #222; text-align: left; font: inherit; cursor: pointer; white-space: nowrap; }
        #bom-context-menu button:hover { background: #eff6ff; color: #1d4ed8; }
        
        .toolbar { margin-bottom: 10px; display: flex; gap: 10px; align-items: center; }
        .btn { padding: 6px 14px; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #1d4ed8; }
        .status-tip { color: #059669; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

    <div class="bom-container">
        <div class="company-title" contenteditable="true">PRO WELL (VIETNAM) CO.,LTD</div>
        <div class="doc-title" contenteditable="true">樣品單-多配色</div>

        <table class="info-table">
            <tr>
                <td class="info-label">Sample Order No.:</td>
                <td class="info-val" contenteditable="true" id="val-order-no">260915009</td>
                <td class="info-label">Sample Type:</td>
                <td class="info-val" contenteditable="true">CFM 確認樣</td>
            </tr>
            <tr>
                <td class="info-label">Customer:</td>
                <td class="info-val" contenteditable="true">-</td>
                <td class="info-label">Season：</td>
                <td class="info-val" contenteditable="true">FW27</td>
            </tr>
            <tr>
                <td class="info-label">Brand：</td>
                <td class="info-val" contenteditable="true">-</td>
                <td class="info-label">Gender:</td>
                <td class="info-val" contenteditable="true">W'S US</td>
            </tr>
            <tr>
                <td class="info-label">Style No.：</td>
                <td class="info-val" contenteditable="true" id="val-style-no">ON-27Q3-094W</td>
                <td class="info-label">Style Name:</td>
                <td class="info-val" contenteditable="true" id="val-style-name">CLOUDMUSE SENSA</td>
            </tr>
            <tr>
                <td class="info-label">Last No.：</td>
                <td class="info-val" contenteditable="true">21-009-W-LOW</td>
                <td class="info-label">Bottom No.：</td>
                <td class="info-val" contenteditable="true">ON180-PT</td>
            </tr>
            <tr>
                <td class="info-label">Shoetype：</td>
                <td class="info-val" contenteditable="true" colspan="3">PAD PERFORMANCE ALL DAY</td>
            </tr>
        </table>

        <div class="toolbar">
            <button class="btn" id="save-btn">💾 保存状态确认</button>
            <span class="status-tip" id="status-tip"></span>
        </div>

        <div id="bom-table"></div>

        <table class="excel-footer">
            <tr>
                <td contenteditable="true"><strong>核准：</strong></td>
                <td contenteditable="true"><strong>審核人：</strong></td>
                <td contenteditable="true"><strong>制表人：</strong></td>
            </tr>
        </table>
    </div>

    <script>
        let tableInstance = null;
        const undoStack = [];
        const redoStack = [];
        let clipboardValue = '';
        let hasClipboardValue = false;
        let applyingHistory = false;

        fetch('/api/bom/header')
            .then(res => res.json())
            .then(headerData => {
                if (headerData.style_name) {
                    document.getElementById('val-order-no').innerText = headerData.sample_order_no || '';
                    document.getElementById('val-style-no').innerText = headerData.style_no || '';
                    document.getElementById('val-style-name').innerText = headerData.style_name || '';
                }
            }).catch(err => console.log("加载头部信息提示:", err));

        fetch('/api/bom/matrix')
            .then(res => res.json())
            .then(resData => {
                const inputEditor = new VTable.editors.InputEditor();

                const colorCodes = resData.columns || [];
                const columns = [
                    { field: 'part_name', title: 'Parts (部件)', width: 140 },
                    { field: 'material_desc', title: 'Material Description', width: 320, editor: inputEditor },
                    { field: 'unit', title: 'Unit', width: 70, editor: inputEditor }
                ];
                colorCodes.forEach(code => {
                    columns.push(
                        { field: code + '_color', title: code, width: 220, editor: inputEditor },
                        { field: code + '_process', title: 'Process', width: 220, editor: inputEditor }
                    );
                });

                const records = (resData.data || []).map(item => {
                    const record = {
                        item_id: item.item_id,
                        part_name: item.part_name || '',
                        material_desc: item.material_desc || '',
                        unit: item.unit || ''
                    };
                    colorCodes.forEach(code => {
                        const detail = (item.color_details && item.color_details[code]) || {};
                        record[code + '_color'] = detail.color_desc || '';
                        record[code + '_process'] = detail.process_desc || '';
                    });
                    return record;
                });

                const tip = document.getElementById('status-tip');
                const showTip = (message, isError = false) => {
                    tip.innerText = message;
                    tip.style.color = isError ? '#dc2626' : '';
                    if (!isError) setTimeout(() => { tip.innerText = ''; }, 4000);
                };
                const postJSON = async (url, body) => {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error || `请求失败 (${response.status})`);
                    return result;
                };
                const reloadAfter = async (url, body) => {
                    await postJSON(url, body);
                    location.reload();
                };
                const dynamicColumn = col => col >= 3 && col < columns.length;
                const getRowIndex = cell => cell.row - 1;
                const getRecord = cell => tableInstance.getCellOriginRecord(cell.col, cell.row);

                tableInstance = new VTable.ListTable({
                    container: document.getElementById('bom-table'),
                    records,
                    columns,
                    autoWrapText: true,
                    headerRowHeight: 40,
                    rowHeight: 35,
                    frozenColCount: 3,
                    editCellTrigger: ['click'],
                    resize: {
                        columnResizeType: 'all',
                        rowResizeType: 'all',
                        rowResizeMode: 'all'
                    },
                    keyboardOptions: {
                        copySelected: true,
                        pasteValueToCell: true
                    }
                });

                tableInstance.on('change_cell_value', args => {
                    const { col, row, value, oldValue } = args;
                    if (value === oldValue) return;

                    const field = columns[col] && columns[col].field;
                    const record = getRecord({ col, row });
                    if (!record || !record.item_id || !field) return;

                    if (!applyingHistory) {
                        undoStack.push({ itemID: record.item_id, col, oldValue, value });
                        redoStack.length = 0;
                    }

                    let colorCode = '';
                    let fieldType = '';
                    if (field.endsWith('_color')) {
                        colorCode = field.slice(0, -'_color'.length);
                        fieldType = 'color';
                    } else if (field.endsWith('_process')) {
                        colorCode = field.slice(0, -'_process'.length);
                        fieldType = 'process';
                    }
                    if (!colorCode || !fieldType) return;

                    postJSON('/api/bom/update-cell', {
                        item_id: record.item_id,
                        color_code: colorCode,
                        field_type: fieldType,
                        value: value || ''
                    })
                    .then(() => showTip(`✓ 数据库实时同步成功 (物料ID: ${record.item_id})`))
                    .catch(err => {
                        console.error('单元格实时同步失败:', err);
                        showTip(`单元格同步失败：${err.message}`, true);
                    });
                });

                const copyCell = async cell => {
                    clipboardValue = String(tableInstance.getCellValue(cell.col, cell.row) ?? '');
                    hasClipboardValue = true;
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(clipboardValue);
                    }
                    showTip('✓ 已复制单元格');
                };
                const pasteCell = async cell => {
                    if (navigator.clipboard && window.isSecureContext) {
                        try {
                            clipboardValue = await navigator.clipboard.readText();
                            hasClipboardValue = true;
                        } catch (err) {
                            if (!hasClipboardValue) throw err;
                        }
                    }
                    if (!hasClipboardValue) {
                        showTip('剪贴板没有可粘贴的内容', true);
                        return;
                    }
                    tableInstance.changeCellValue(cell.col, cell.row, clipboardValue);
                };
                const applyHistory = (from, to, value) => {
                    const change = from.pop();
                    if (!change) return;
                    const rowIndex = records.findIndex(record => record.item_id === change.itemID);
                    if (rowIndex < 0) {
                        from.push(change);
                        showTip('无法撤销：对应物料行已不存在', true);
                        return;
                    }
                    applyingHistory = true;
                    try {
                        tableInstance.changeCellValue(change.col, rowIndex + 1, value(change));
                    } finally {
                        applyingHistory = false;
                    }
                    to.push(change);
                };

                const contextMenu = document.createElement('div');
                contextMenu.id = 'bom-context-menu';
                contextMenu.setAttribute('role', 'menu');
                document.body.appendChild(contextMenu);

                const hideContextMenu = () => {
                    contextMenu.style.display = 'none';
                    contextMenu.replaceChildren();
                };
                const showContextMenu = (event, actions) => {
                    contextMenu.replaceChildren();
                    actions.forEach(({ label, run }) => {
                        const button = document.createElement('button');
                        button.type = 'button';
                        button.setAttribute('role', 'menuitem');
                        button.textContent = label;
                        button.addEventListener('click', async () => {
                            hideContextMenu();
                            try {
                                await run();
                            } catch (err) {
                                console.error('右键菜单操作失败:', err);
                                showTip(`操作失败：${err.message}`, true);
                            }
                        });
                        contextMenu.appendChild(button);
                    });
                    contextMenu.style.display = 'block';
                    const menuRect = contextMenu.getBoundingClientRect();
                    contextMenu.style.left = `${Math.max(0, Math.min(event.clientX, window.innerWidth - menuRect.width))}px`;
                    contextMenu.style.top = `${Math.max(0, Math.min(event.clientY, window.innerHeight - menuRect.height))}px`;
                };

                document.addEventListener('pointerdown', event => {
                    if (!contextMenu.contains(event.target)) hideContextMenu();
                });
                document.addEventListener('keydown', event => {
                    if (event.key === 'Escape') hideContextMenu();
                });
                window.addEventListener('resize', hideContextMenu);

                document.getElementById('bom-table').addEventListener('contextmenu', event => {
                    const cell = tableInstance.getCellAt(event.clientX, event.clientY);
                    if (!cell) return;
                    event.preventDefault();
                    event.stopPropagation();

                    if (cell.row === 0 && dynamicColumn(cell.col)) {
                        const column = columns[cell.col];
                        const oldTitle = column.title;
                        showContextMenu(event, [
                            {
                                label: '编辑列名',
                                run: async () => {
                            const newTitle = prompt(`请输入列 [${oldTitle}] 的新名称：`, oldTitle);
                            if (!newTitle || !newTitle.trim() || newTitle.trim() === oldTitle) return;

                            const trimmedTitle = newTitle.trim();
                            column.title = trimmedTitle;
                            tableInstance.updateColumns(columns);
                            if (column.field.endsWith('_color')) {
                                const colorCode = column.field.slice(0, -'_color'.length);
                                postJSON('/api/bom/update-column', { old_code: colorCode, new_code: trimmedTitle })
                                    .then(() => {
                                        showTip(`✓ 列名已从 [${colorCode}] 修改为 [${trimmedTitle}] 并同步至数据库！`);
                                        setTimeout(() => location.reload(), 1000);
                                    })
                                    .catch(err => {
                                        column.title = oldTitle;
                                        tableInstance.updateColumns(columns);
                                        console.error('列名同步失败:', err);
                                        showTip(`列名同步失败：${err.message}`, true);
                                    });
                            }
                                }
                            },
                            {
                                label: '左侧插入列',
                                run: async () => {
                                    const colorCode = prompt('请输入新列名称：', `3WH${Math.floor(Math.random() * 90000000 + 10000000)}`);
                                    if (colorCode && colorCode.trim()) {
                                        await reloadAfter('/api/bom/add-column', { color_code: colorCode.trim() });
                                    }
                                }
                            },
                            {
                                label: '右侧插入列',
                                run: async () => {
                                    const colorCode = prompt('请输入新列名称：', `3WH${Math.floor(Math.random() * 90000000 + 10000000)}`);
                                    if (colorCode && colorCode.trim()) {
                                        await reloadAfter('/api/bom/add-column', { color_code: colorCode.trim() });
                                    }
                                }
                            },
                            {
                                label: '删除当前列',
                                run: async () => {
                                    if (!confirm(`确定要删除列 [${oldTitle}] 及其关联数据吗？`)) return;
                                    const colorCode = column.field.endsWith('_process')
                                        ? column.field.slice(0, -'_process'.length)
                                        : column.field.slice(0, -'_color'.length);
                                    await reloadAfter('/api/bom/delete-column', { color_code: colorCode });
                                }
                            }
                        ]);
                        return;
                    }

                    if (cell.row === 0) {
                        hideContextMenu();
                        return;
                    }
                    const rowIndex = getRowIndex(cell);
                    if (rowIndex < 0) return;

                    const actions = [];
                    if (!dynamicColumn(cell.col)) {
                        actions.push(
                            {
                                label: '上方插入行',
                                run: async () => {
                                    const result = await postJSON('/api/bom/add-row', {
                                        part_name: 'NEW PART',
                                        material_desc: 'NEW MATERIAL',
                                        unit: 'MTR'
                                    });
                                    if (!result.success || !result.item_id) throw new Error('新增物料接口未返回物料编号');
                                    const newRecord = {
                                        item_id: result.item_id,
                                        part_name: 'NEW PART',
                                        material_desc: 'NEW MATERIAL',
                                        unit: 'MTR',
                                        ...Object.fromEntries(colorCodes.flatMap(code => [[code + '_color', ''], [code + '_process', '']]))
                                    };
                                    tableInstance.addRecord(newRecord, rowIndex);
                                    records.splice(rowIndex, 0, newRecord);
                                }
                            },
                            {
                                label: '下方插入行',
                                run: async () => {
                                    const result = await postJSON('/api/bom/add-row', {
                                        part_name: 'NEW PART',
                                        material_desc: 'NEW MATERIAL',
                                        unit: 'MTR'
                                    });
                                    if (!result.success || !result.item_id) throw new Error('新增物料接口未返回物料编号');
                                    const insertAt = rowIndex + 1;
                                    const newRecord = {
                                        item_id: result.item_id,
                                        part_name: 'NEW PART',
                                        material_desc: 'NEW MATERIAL',
                                        unit: 'MTR',
                                        ...Object.fromEntries(colorCodes.flatMap(code => [[code + '_color', ''], [code + '_process', '']]))
                                    };
                                    tableInstance.addRecord(newRecord, insertAt);
                                    records.splice(insertAt, 0, newRecord);
                                }
                            },
                            {
                                label: '删除当前行',
                                run: async () => {
                                    const record = getRecord(cell);
                                    if (!record || !record.item_id || !confirm('确定要删除当前物料行及其关联明细吗？')) return;
                                    await postJSON('/api/bom/delete-row', { item_id: record.item_id });
                                    tableInstance.deleteRecords([rowIndex]);
                                    records.splice(rowIndex, 1);
                                }
                            }
                        );
                    }
                    actions.push(
                        { label: '复制单元格', run: () => copyCell(cell) },
                        { label: '粘贴到单元格', run: () => pasteCell(cell) },
                        { label: '撤销', run: () => applyHistory(undoStack, redoStack, change => change.oldValue) },
                        { label: '重做', run: () => applyHistory(redoStack, undoStack, change => change.value) }
                    );
                    showContextMenu(event, actions);
                });
            })
            .catch(err => {
                console.error("加载 BOM 矩阵数据失败:", err);
                alert(`加载 BOM 矩阵数据失败：${err.message || err}，请按 F12 检查控制台。`);
            });

        document.getElementById('save-btn').addEventListener('click', () => {
            const tip = document.getElementById('status-tip');
            tip.innerText = "✓ 所有整单数据已实时同步至 MariaDB 数据库！";
            setTimeout(() => { tip.innerText = ""; }, 4000);
        });
    </script>
</body>
</html>
