<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PRO WELL (VIETNAM) CO.,LTD - 鞋款多配色 BOM 展开矩阵 (.env 配置版)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 15px; background-color: #f4f6f9; color: #333; font-size: 13px; }
        .bom-container { background: #fff; padding: 20px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 98%; margin: 0 auto; }
        
        .company-title { font-size: 16px; font-weight: bold; color: #222; outline: none; }
        .doc-title { font-size: 18px; font-weight: bold; text-align: center; color: #000; margin: 10px 0; outline: none; }
        .info-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 12px; }
        .info-table td { border: 1px solid #ccc; padding: 5px 8px; background: #fafafa; }
        .info-label { font-weight: bold; color: #555; width: 15%; }
        .info-val { color: #000; width: 35%; outline: none; background: #fff; }
        .info-val:focus { background: #eef4ff; border: 1px solid #3b82f6; }

        .excel-footer { width: 100%; margin-top: 20px; border-collapse: collapse; font-size: 13px; }
        .excel-footer td { padding: 15px 10px; border: 1px solid #ccc; outline: none; background: #fafafa; width: 33.33%; }
        .excel-footer td:focus { background: #eef4ff; }

        #bom-table { width: 100%; height: 600px; margin-bottom: 15px; border: 1px solid #ccc; }
        
        .toolbar { margin-bottom: 10px; display: flex; gap: 10px; align-items: center; }
        .btn { padding: 6px 14px; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #1d4ed8; }
        .status-tip { color: #059669; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

    <div class="bom-container">
        <div class="company-title" contenteditable="true">PRO WELL (VIETNAM) CO.,LTD</div>
        <div class="doc-title" contenteditable="true">樣品單-多配色</div>

        <table class="info-table">
            <tr>
                <td class="info-label">Sample Order No.:</td>
                <td class="info-val" contenteditable="true" id="val-order-no">260915009</td>
                <td class="info-label">Sample Type:</td>
                <td class="info-val" contenteditable="true">CFM 確認樣</td>
            </tr>
            <tr>
                <td class="info-label">Customer:</td>
                <td class="info-val" contenteditable="true">-</td>
                <td class="info-label">Season：</td>
                <td class="info-val" contenteditable="true">FW27</td>
            </tr>
            <tr>
                <td class="info-label">Brand：</td>
                <td class="info-val" contenteditable="true">-</td>
                <td class="info-label">Gender:</td>
                <td class="info-val" contenteditable="true">W'S US</td>
            </tr>
            <tr>
                <td class="info-label">Style No.：</td>
                <td class="info-val" contenteditable="true" id="val-style-no">ON-27Q3-094W</td>
                <td class="info-label">Style Name:</td>
                <td class="info-val" contenteditable="true" id="val-style-name">CLOUDMUSE SENSA</td>
            </tr>
            <tr>
                <td class="info-label">Last No.：</td>
                <td class="info-val" contenteditable="true">21-009-W-LOW</td>
                <td class="info-label">Bottom No.：</td>
                <td class="info-val" contenteditable="true">ON180-PT</td>
            </tr>
            <tr>
                <td class="info-label">Shoetype：</td>
                <td class="info-val" contenteditable="true" colspan="3">PAD PERFORMANCE ALL DAY</td>
            </tr>
        </table>

        <div class="toolbar">
            <button class="btn" id="save-btn">💾 保存状态确认</button>
            <span class="status-tip" id="status-tip"></span>
        </div>

        <div id="bom-table"></div>

        <table class="excel-footer">
            <tr>
                <td contenteditable="true"><strong>核准：</strong></td>
                <td contenteditable="true"><strong>審核人：</strong></td>
                <td contenteditable="true"><strong>制表人：</strong></td>
            </tr>
        </table>
    </div>

    <script>
        let hotInstance = null;

        fetch('/api/bom/header')
            .then(res => res.json())
            .then(headerData => {
                if (headerData.style_name) {
                    document.getElementById('val-order-no').innerText = headerData.sample_order_no || '';
                    document.getElementById('val-style-no').innerText = headerData.style_no || '';
                    document.getElementById('val-style-name').innerText = headerData.style_name || '';
                }
            }).catch(err => console.log("加载头部信息提示:", err));

        fetch('/api/bom/matrix')
            .then(res => res.json())
            .then(resData => {
                let colObjects = [
                    { data: 'part_name', title: 'Parts (部件)', width: 140, readOnly: true },
                    { data: 'material_desc', title: 'Material Description', width: 320, readOnly: false },
                    { data: 'unit', title: 'Unit', width: 70, readOnly: false }
                ];

                let colHeaders = ['Parts (部件)', 'Material Description', 'Unit'];
                let colorColumnsIndex = [];
                let allDynamicColumnsIndex = [];

                if (resData.columns && resData.columns.length > 0) {
                    resData.columns.forEach(code => {
                        let colorIdx = colObjects.length;
                        colorColumnsIndex.push(colorIdx);
                        allDynamicColumnsIndex.push(colorIdx);
                        colObjects.push({ data: code + '_color', title: code, width: 220, readOnly: false });
                        colHeaders.push(code);

                        let processIdx = colObjects.length;
                        allDynamicColumnsIndex.push(processIdx);
                        colObjects.push({ data: code + '_process', title: 'Process', width: 220, readOnly: false });
                        colHeaders.push('Process');
                    });
                }

                let dataSource = [];
                if (resData.data && resData.data.length > 0) {
                    dataSource = resData.data.map(item => {
                        let row = {
                            item_id: item.item_id,
                            part_name: item.part_name || '',
                            material_desc: item.material_desc || '',
                            unit: item.unit || ''
                        };

                        if (resData.columns) {
                            resData.columns.forEach(code => {
                                let detail = (item.color_details && item.color_details[code]) || {};
                                row[code + '_color'] = detail.color_desc || '';
                                row[code + '_process'] = detail.process_desc || '';
                            });
                        }
                        return row;
                    });
                }

                const container = document.getElementById('bom-table');
                hotInstance = new Handsontable(container, {
                    data: dataSource,
                    columns: colObjects,
                    colHeaders: colHeaders,
                    rowHeaders: true,
                    manualColumnResize: true,
                    manualRowResize: true,
                    afterChange: function(changes, source) {
                        if (source === 'loadData' || !changes) return;

                        changes.forEach(([row, prop, oldValue, newValue]) => {
                            if (oldValue === newValue) return;

                            const rowData = hotInstance.getSourceDataAtRow(row);
                            const itemID = rowData.item_id;
                            if (!itemID) return;

                            let colorCode = "";
                            let fieldType = "";

                            resData.columns.forEach(code => {
                                if (prop === code + '_color') {
                                    colorCode = code;
                                    fieldType = 'color';
                                } else if (prop === code + '_process') {
                                    colorCode = code;
                                    fieldType = 'process';
                                }
                            });

                            if (colorCode && fieldType) {
                                fetch('/api/bom/update-cell', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        item_id: itemID,
                                        color_code: colorCode,
                                        field_type: fieldType,
                                        value: newValue || ''
                                    })
                                })
                                .then(res => res.json())
                                .then(result => {
                                    const tip = document.getElementById('status-tip');
                                    tip.innerText = `✓ 数据库实时同步成功 (物料ID: ${itemID})`;
                                    setTimeout(() => { tip.innerText = ""; }, 3000);
                                });
                            }
                        });
                    },
                    afterRemoveRow: function(index, amount, physicalRows) {
                        physicalRows.forEach(rowIndex => {
                            const rowData = hotInstance.getSourceDataAtRow(rowIndex);
                            if (rowData && rowData.item_id) {
                                fetch('/api/bom/delete-row', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ item_id: rowData.item_id })
                                });
                            }
                        });
                    },
                    afterCreateRow: function(index, amount) {
                        fetch('/api/bom/add-row', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ part_name: 'NEW PART', material_desc: 'NEW MATERIAL', unit: 'MTR' })
                        })
                        .then(res => res.json())
                        .then(res => {
                            if (res.success && res.item_id) {
                                hotInstance.setDataAtCell(index, 0, 'NEW PART');
                                hotInstance.setDataAtCell(index, 1, 'NEW MATERIAL');
                                hotInstance.setDataAtCell(index, 2, 'MTR');
                                const rowData = hotInstance.getSourceDataAtRow(index);
                                rowData.item_id = res.item_id;
                            }
                        });
                    },
                    contextMenu: {
                        items: {
                            "edit_column_name": {
                                name: '编辑列名',
                                hidden: function() {
                                    const selected = hotInstance.getSelectedRange();
                                    if (!selected || selected.length === 0) return true;
                                    const col = selected[0].from.col;
                                    return !allDynamicColumnsIndex.includes(col);
                                },
                                callback: function (key, selection) {
                                    const col = selection[0].start.col;
                                    const oldName = hotInstance.getColHeader(col);
                                    const newName = prompt(`请输入列 [${oldName}] 的新名称：`, oldName);
                                    if (newName && newName.trim() !== "" && newName !== oldName) {
                                        const trimmedNewName = newName.trim();
                                        const currentHeaders = [...hotInstance.getColHeader()];
                                        currentHeaders[col] = trimmedNewName;
                                        hotInstance.updateSettings({ colHeaders: currentHeaders });

                                        if (colorColumnsIndex.includes(col)) {
                                            fetch('/api/bom/update-column', {
                                                method: 'POST',
                                                headers: { 'Content-Type': 'application/json' },
                                                body: JSON.stringify({ old_code: oldName, new_code: trimmedNewName })
                                            }).then(() => {
                                                const tip = document.getElementById('status-tip');
                                                tip.innerText = `✓ 列名已从 [${oldName}] 修改为 [${trimmedNewName}] 并同步至数据库！`;
                                                setTimeout(() => { tip.innerText = ""; }, 4000);
                                            });
                                        }
                                    }
                                }
                            },
                            "add_column_left": {
                                name: '左侧插入列',
                                hidden: function() {
                                    const selected = hotInstance.getSelectedRange();
                                    if (!selected || selected.length === 0) return true;
                                    const col = selected[0].from.col;
                                    return !allDynamicColumnsIndex.includes(col);
                                },
                                callback: function() {
                                    const newCode = prompt("请输入新列名称：", "3WH" + Math.floor(Math.random()*90000000+10000000));
                                    if (newCode && newCode.trim() !== "") {
                                        fetch('/api/bom/add-column', {
                                            method: 'POST',
                                            headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({ color_code: newCode.trim() })
                                        }).then(() => { location.reload(); });
                                    }
                                }
                            },
                            "add_column_right": {
                                name: '右侧插入列',
                                hidden: function() {
                                    const selected = hotInstance.getSelectedRange();
                                    if (!selected || selected.length === 0) return true;
                                    const col = selected[0].from.col;
                                    return !allDynamicColumnsIndex.includes(col);
                                },
                                callback: function() {
                                    const newCode = prompt("请输入新列名称：", "3WH" + Math.floor(Math.random()*90000000+10000000));
                                    if (newCode && newCode.trim() !== "") {
                                        fetch('/api/bom/add-column', {
                                            method: 'POST',
                                            headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({ color_code: newCode.trim() })
                                        }).then(() => { location.reload(); });
                                    }
                                }
                            },
                            "remove_column": {
                                name: '删除当前列',
                                hidden: function() {
                                    const selected = hotInstance.getSelectedRange();
                                    if (!selected || selected.length === 0) return true;
                                    const col = selected[0].from.col;
                                    return !allDynamicColumnsIndex.includes(col);
                                },
                                callback: function(key, selection) {
                                    const col = selection[0].start.col;
                                    let colName = hotInstance.getColHeader(col);
                                    if (confirm(`确定要删除列 [${colName}] 及其关联数据吗？`)) {
                                        let targetCode = colName;
                                        if (!colorColumnsIndex.includes(col)) {
                                            targetCode = hotInstance.getColHeader(col - 1);
                                        }
                                        fetch('/api/bom/delete-column', {
                                            method: 'POST',
                                            headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({ color_code: targetCode })
                                        }).then(() => { location.reload(); });
                                    }
                                }
                            },
                            "row_above": {
                                name: '上方插入行',
                                hidden: function() {
                                    const selected = hotInstance.getSelectedRange();
                                    if (!selected || selected.length === 0) return false;
                                    const col = selected[0].from.col;
                                    return allDynamicColumnsIndex.includes(col);
                                }
                            },
                            "row_below": {
                                name: '下方插入行',
                                hidden: function() {
                                    const selected = hotInstance.getSelectedRange();
                                    if (!selected || selected.length === 0) return false;
                                    const col = selected[0].from.col;
                                    return allDynamicColumnsIndex.includes(col);
                                }
                            },
                            "remove_row": {
                                name: '删除当前行',
                                hidden: function() {
                                    const selected = hotInstance.getSelectedRange();
                                    if (!selected || selected.length === 0) return false;
                                    const col = selected[0].from.col;
                                    return allDynamicColumnsIndex.includes(col);
                                }
                            },
                            "hsep1": "---------",
                            "undo": { name: '撤销' },
                            "redo": { name: '重做' },
                            "copy": { name: '复制' },
                            "paste": { name: '粘贴' }
                        }
                    },
                    fixedColumnsLeft: 3,
                    columnHeaderHeight: 40,
                    height: '100%',
                    licenseKey: 'non-commercial-and-evaluation'
                });
            })
            .catch(err => {
                console.error("加载 BOM 矩阵数据失败:", err);
                alert("加载 BOM 矩阵数据失败，请按 F12 检查控制台。");
            });

        document.getElementById('save-btn').addEventListener('click', () => {
            const tip = document.getElementById('status-tip');
            tip.innerText = "✓ 所有整单数据已实时同步至 MariaDB 数据库！";
            setTimeout(() => { tip.innerText = ""; }, 4000);
        });
    </script>
</body>
</html>
